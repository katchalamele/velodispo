# Dev conteneurisé : docker compose run --rm {test|vet|build|fmt|dev}

x-go-common: &go-common
  image: golang:1.22-alpine
  working_dir: /app
  environment:
    GOFLAGS: -mod=mod
    GOCACHE: /go/cache
  volumes:
    - .:/app
    - go-mod-cache:/go/pkg/mod
    - go-build-cache:/go/cache

services:
  test:
    <<: *go-common
    command: ["go", "test", "./..."]

  vet:
    <<: *go-common
    command: ["go", "vet", "./..."]

  build:
    <<: *go-common
    command: ["go", "build", "./..."]

  fmt:
    <<: *go-common
    entrypoint: ["sh", "-c"]
    command: ['test -z "$(gofmt -l .)" || { echo "Fichiers non formatés :"; gofmt -l .; exit 1; }']

  dev:
    <<: *go-common
    command: ["sh"]

volumes:
  go-mod-cache:
  go-build-cache:
